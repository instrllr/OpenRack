name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libx11-dev libxinerama-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxcomposite-dev \
            libfreetype-dev libfontconfig1-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      # Package the app so file permissions survive the artifact upload.
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          BIN=$(find build/OpenRack_artefacts -type f -name OpenRack | head -1)
          tar czf OpenRack-Linux.tar.gz -C "$(dirname "$BIN")" OpenRack

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          APP=$(find build/OpenRack_artefacts -maxdepth 3 -name OpenRack.app | head -1)
          codesign --force --deep --sign - "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" OpenRack-macOS.zip
          mkdir -p pkgroot/Applications
          cp -R "$APP" pkgroot/Applications/
          pkgbuild --root pkgroot --identifier com.openrack.OpenRack \
            --version 0.1.0 --install-location / OpenRack-macOS.pkg

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build/OpenRack_artefacts -Recurse -Filter OpenRack.exe | Select-Object -First 1
          Compress-Archive -Path $exe.FullName -DestinationPath OpenRack-Windows.zip

      # Plugin versions (VST3 for FL Studio / Ableton, AU for Logic Pro).
      - name: Package plugins (Linux)
        if: runner.os == 'Linux'
        run: |
          VST3=$(find build/OpenRackPlugin_artefacts -maxdepth 4 -type d -name OpenRack.vst3 | head -1)
          tar czf OpenRack-VST3-Linux.tar.gz -C "$(dirname "$VST3")" OpenRack.vst3

      - name: Package plugins (macOS)
        if: runner.os == 'macOS'
        run: |
          VST3=$(find build/OpenRackPlugin_artefacts -maxdepth 4 -type d -name OpenRack.vst3 | head -1)
          AU=$(find build/OpenRackPlugin_artefacts -maxdepth 4 -type d -name OpenRack.component | head -1)
          codesign --force --deep --sign - "$VST3"
          codesign --force --deep --sign - "$AU"
          ROOT="$GITHUB_WORKSPACE/pkgroot-plugins"
          mkdir -p "$ROOT/Library/Audio/Plug-Ins/VST3" "$ROOT/Library/Audio/Plug-Ins/Components"
          cp -R "$VST3" "$ROOT/Library/Audio/Plug-Ins/VST3/"
          cp -R "$AU" "$ROOT/Library/Audio/Plug-Ins/Components/"
          pkgbuild --root "$ROOT" --identifier com.openrack.OpenRack.plugins \
            --version 0.1.0 --install-location / OpenRack-Plugins-macOS.pkg
          (cd "$(dirname "$VST3")" && ditto -c -k --keepParent OpenRack.vst3 "$GITHUB_WORKSPACE/OpenRack-VST3-macOS.zip")
          (cd "$(dirname "$AU")" && ditto -c -k --keepParent OpenRack.component "$GITHUB_WORKSPACE/OpenRack-AU-macOS.zip")

      - name: Package plugins (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vst3 = Get-ChildItem -Path build/OpenRackPlugin_artefacts -Recurse -Directory -Filter OpenRack.vst3 | Select-Object -First 1
          Compress-Archive -Path $vst3.FullName -DestinationPath OpenRack-VST3-Windows.zip

      # Validate the plugins the way DAWs do. These report results but do not
      # block the build, so a validation finding never hides the build outputs.
      - name: Validate AU with auval (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          AU=$(find build/OpenRackPlugin_artefacts -maxdepth 4 -type d -name OpenRack.component | head -1)
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$AU" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 5
          echo "--- registered OpenRack components"
          auval -a 2>&1 | grep -i "orak\|openrack" || echo "(not listed)"
          echo "--- auval"
          auval -v aufx Orak Orck 2>&1 | tee auval.txt
          grep -q "AU VALIDATION SUCCEEDED" auval.txt

      - name: Validate VST3 with pluginval (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          VST3=$(find build/OpenRackPlugin_artefacts -maxdepth 4 -type d -name OpenRack.vst3 | head -1)
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate-in-process \
            --timeout-ms 120000 "$VST3" 2>&1 | tee pluginval.txt

      - name: Validate VST3 with pluginval (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          sudo apt-get install -y xvfb libcurl4-openssl-dev
          VST3=$(find build/OpenRackPlugin_artefacts -maxdepth 4 -type d -name OpenRack.vst3 | head -1)
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          unzip -q pluginval.zip
          chmod +x pluginval
          xvfb-run -a ./pluginval --strictness-level 5 --validate-in-process \
            --timeout-ms 120000 "$VST3" 2>&1 | tee pluginval.txt

      - name: Validate VST3 with pluginval (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $vst3 = Get-ChildItem -Path build/OpenRackPlugin_artefacts -Recurse -Directory -Filter OpenRack.vst3 | Select-Object -First 1
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pv
          & ./pv/pluginval.exe --strictness-level 5 --validate-in-process --timeout-ms 120000 $vst3.FullName 2>&1 | Tee-Object -FilePath pluginval.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Out-of-process hosting self-test: loads OpenRack's own VST3 through a helper process,
      # pushes audio through it, then kills the helper and checks that it recovers.
      - name: Out-of-process host self-test (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          sudo apt-get install -y xvfb
          BIN=$(find build/OpenRack_artefacts -type f -name OpenRack | head -1)
          VST3=$(find build/OpenRackPlugin_artefacts -maxdepth 4 -type d -name OpenRack.vst3 | head -1)
          timeout 200 xvfb-run -a "$BIN" --hosttest "$VST3" 2>&1 | tee hosttest.txt
          grep -q "HOSTTEST: PASS" hosttest.txt

      - name: Out-of-process host self-test (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          BIN=$(find build/OpenRack_artefacts -maxdepth 5 -type f -path "*OpenRack.app/Contents/MacOS/OpenRack" | head -1)
          VST3=$(find build/OpenRackPlugin_artefacts -maxdepth 4 -type d -name OpenRack.vst3 | head -1)
          perl -e 'alarm 200; exec @ARGV' "$BIN" --hosttest "$VST3" 2>&1 | tee hosttest.txt
          grep -q "HOSTTEST: PASS" hosttest.txt

      - name: Out-of-process host self-test (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build/OpenRack_artefacts -Recurse -Filter OpenRack.exe | Select-Object -First 1
          $vst3 = Get-ChildItem -Path build/OpenRackPlugin_artefacts -Recurse -Directory -Filter OpenRack.vst3 | Select-Object -First 1
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--hosttest", "`"$($vst3.FullName)`"" -RedirectStandardOutput hosttest.txt -PassThru -NoNewWindow
          if (-not $p.WaitForExit(200000)) { $p.Kill(); Get-Content hosttest.txt; exit 1 }
          Get-Content hosttest.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: OpenRack-${{ runner.os }}
          path: |
            OpenRack-Linux.tar.gz
            OpenRack-macOS.zip
            OpenRack-macOS.pkg
            OpenRack-Windows.zip
            OpenRack-VST3-Linux.tar.gz
            OpenRack-VST3-macOS.zip
            OpenRack-AU-macOS.zip
            OpenRack-Plugins-macOS.pkg
            OpenRack-VST3-Windows.zip
          if-no-files-found: error
