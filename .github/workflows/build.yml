name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libx11-dev libxinerama-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxcomposite-dev \
            libfreetype-dev libfontconfig1-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      # Does macOS actually load the bridge driver? Install it on the runner,
      # restart CoreAudio and see whether "OpenRack Bridge" shows up as a device.
      - name: Test bridge driver loads (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          DRV=$(find build -maxdepth 3 -type d -name OpenRackBridge.driver | head -1)
          echo "driver bundle: $DRV"
          find "$DRV" -type f
          echo "--- header check: type UUID"
          grep -rn "kAudioServerPlugInTypeUUID" "$(xcrun --show-sdk-path)/System/Library/Frameworks/CoreAudio.framework/Headers/AudioServerPlugIn.h" | head -3 || true
          codesign --force --deep --sign - "$DRV"
          sudo mkdir -p /Library/Audio/Plug-Ins/HAL
          sudo cp -R "$DRV" /Library/Audio/Plug-Ins/HAL/
          sudo chown -R root:wheel /Library/Audio/Plug-Ins/HAL/OpenRackBridge.driver
          sudo killall coreaudiod || true
          sleep 10
          echo "--- audio devices"
          system_profiler SPAudioDataType 2>&1 | tee audio-devices.txt
          echo "--- coreaudiod log"
          log show --last 3m --predicate 'process == "coreaudiod"' --style compact 2>&1 | grep -iE "openrack|plug-in|plugin|driver|HAL" | head -40 || true
          if grep -qi "OpenRack Bridge" audio-devices.txt; then
            echo "RESULT: BRIDGE DEVICE LISTED"
          else
            echo "RESULT: BRIDGE DEVICE NOT LISTED"
            exit 1
          fi

      # Package the app so file permissions survive the artifact upload.
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          BIN=$(find build/OpenRack_artefacts -type f -name OpenRack | head -1)
          tar czf OpenRack-Linux.tar.gz -C "$(dirname "$BIN")" OpenRack

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          APP=$(find build/OpenRack_artefacts -maxdepth 3 -name OpenRack.app | head -1)
          codesign --force --deep --sign - "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" OpenRack-macOS.zip
          mkdir -p pkgroot/Applications
          cp -R "$APP" pkgroot/Applications/
          pkgbuild --root pkgroot --identifier com.openrack.OpenRack \
            --version 0.1.0 --install-location / OpenRack-macOS.pkg

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build/OpenRack_artefacts -Recurse -Filter OpenRack.exe | Select-Object -First 1
          Compress-Archive -Path $exe.FullName -DestinationPath OpenRack-Windows.zip

      # Plugin versions (VST3 for FL Studio / Ableton, AU for Logic Pro).
      - name: Package plugins (Linux)
        if: runner.os == 'Linux'
        run: |
          VST3=$(find build/OpenRackPlugin_artefacts -maxdepth 4 -type d -name OpenRack.vst3 | head -1)
          tar czf OpenRack-VST3-Linux.tar.gz -C "$(dirname "$VST3")" OpenRack.vst3

      - name: Package plugins (macOS)
        if: runner.os == 'macOS'
        run: |
          VST3=$(find build/OpenRackPlugin_artefacts -maxdepth 4 -type d -name OpenRack.vst3 | head -1)
          AU=$(find build/OpenRackPlugin_artefacts -maxdepth 4 -type d -name OpenRack.component | head -1)
          codesign --force --deep --sign - "$VST3"
          codesign --force --deep --sign - "$AU"
          ROOT="$GITHUB_WORKSPACE/pkgroot-plugins"
          mkdir -p "$ROOT/Library/Audio/Plug-Ins/VST3" "$ROOT/Library/Audio/Plug-Ins/Components"
          cp -R "$VST3" "$ROOT/Library/Audio/Plug-Ins/VST3/"
          cp -R "$AU" "$ROOT/Library/Audio/Plug-Ins/Components/"
          pkgbuild --root "$ROOT" --identifier com.openrack.OpenRack.plugins \
            --version 0.1.0 --install-location / OpenRack-Plugins-macOS.pkg
          (cd "$(dirname "$VST3")" && ditto -c -k --keepParent OpenRack.vst3 "$GITHUB_WORKSPACE/OpenRack-VST3-macOS.zip")
          (cd "$(dirname "$AU")" && ditto -c -k --keepParent OpenRack.component "$GITHUB_WORKSPACE/OpenRack-AU-macOS.zip")

      - name: Package bridge driver (macOS)
        if: runner.os == 'macOS'
        run: |
          DRV=$(find build -maxdepth 3 -type d -name OpenRackBridge.driver | head -1)
          codesign --force --deep --sign - "$DRV"
          ROOT="$GITHUB_WORKSPACE/pkgroot-bridge"
          mkdir -p "$ROOT/Library/Audio/Plug-Ins/HAL" "$GITHUB_WORKSPACE/scripts-bridge"
          cp -R "$DRV" "$ROOT/Library/Audio/Plug-Ins/HAL/"
          # Restart CoreAudio after install so the new device appears.
          printf '#!/bin/sh\nkillall coreaudiod 2>/dev/null\nexit 0\n' > "$GITHUB_WORKSPACE/scripts-bridge/postinstall"
          chmod +x "$GITHUB_WORKSPACE/scripts-bridge/postinstall"
          pkgbuild --root "$ROOT" --scripts "$GITHUB_WORKSPACE/scripts-bridge" \
            --identifier com.openrack.bridge.pkg --version 0.1.0 \
            --install-location / OpenRack-Bridge-macOS.pkg

      - name: Package plugins (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vst3 = Get-ChildItem -Path build/OpenRackPlugin_artefacts -Recurse -Directory -Filter OpenRack.vst3 | Select-Object -First 1
          Compress-Archive -Path $vst3.FullName -DestinationPath OpenRack-VST3-Windows.zip

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: OpenRack-${{ runner.os }}
          path: |
            OpenRack-Linux.tar.gz
            OpenRack-macOS.zip
            OpenRack-macOS.pkg
            OpenRack-Windows.zip
            OpenRack-VST3-Linux.tar.gz
            OpenRack-VST3-macOS.zip
            OpenRack-AU-macOS.zip
            OpenRack-Plugins-macOS.pkg
            OpenRack-Bridge-macOS.pkg
            OpenRack-VST3-Windows.zip
          if-no-files-found: error
