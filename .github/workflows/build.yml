name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libx11-dev libxinerama-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxcomposite-dev \
            libfreetype-dev libfontconfig1-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      # Package the app so file permissions survive the artifact upload.
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          BIN=$(find build/OpenRack_artefacts -type f -name OpenRack | head -1)
          tar czf OpenRack-Linux.tar.gz -C "$(dirname "$BIN")" OpenRack

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          APP=$(find build/OpenRack_artefacts -maxdepth 3 -name OpenRack.app | head -1)
          codesign --force --deep --sign - "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" OpenRack-macOS.zip
          mkdir -p pkgroot/Applications
          cp -R "$APP" pkgroot/Applications/
          pkgbuild --root pkgroot --identifier com.openrack.OpenRack \
            --version 0.1.0 --install-location / OpenRack-macOS.pkg

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build/OpenRack_artefacts -Recurse -Filter OpenRack.exe | Select-Object -First 1
          Compress-Archive -Path $exe.FullName -DestinationPath OpenRack-Windows.zip

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: OpenRack-${{ runner.os }}
          path: |
            OpenRack-Linux.tar.gz
            OpenRack-macOS.zip
            OpenRack-macOS.pkg
            OpenRack-Windows.zip
          if-no-files-found: error
